<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" fill="none">
  <!-- Anneau circulaire doré -->
  <circle cx="24" cy="24" r="20" stroke="#cda540" stroke-width="1.5" fill="none"/>

  <!-- Trait interne décoratif -->
  <circle cx="24" cy="24" r="15" stroke="#78427f" stroke-width="0.5" stroke-dasharray="3 4" fill="none"/>

  <!-- Courbe équine stylisée (silhouette tête de cheval abstraite) -->
  <path d="M18 14 C18 14 16 16 16 19 C16 22 17 23 19 24 C20 24.5 20.5 25 20 27 C19.5 29 18 30 18 30"
        stroke="#cda540" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Point focal doré (oeil / étoile) -->
  <circle cx="22" cy="18" r="1.5" fill="#cda540"/>

  <!-- Initiales SD -->
  <text x="28" y="28"
        font-family="Georgia, serif"
        font-size="16"
        font-weight="bold"
        fill="#cda540"
        letter-spacing="1">SD</text>

  <!-- Séparateur vertical fin -->
  <line x1="56" y1="10" x2="56" y2="38" stroke="#cda540" stroke-width="0.5" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="62" y="22"
        font-family="Georgia, serif"
        font-size="10"
        font-weight="bold"
        fill="#ffffff"
        letter-spacing="0.5">Équicoaching</text>
  <text x="62" y="34"
        font-family="Georgia, serif"
        font-size="7.5"
        fill="#cda540"
        letter-spacing="1.5">NEUROSCIENCES</text>
</svg>
